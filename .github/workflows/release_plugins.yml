name: Tag submodules on release

on:
  # The create event fires for every new branch and tag, the tags filter
  # below is not applied to it. The job checks the ref itself.
  create:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Print the ref the guard saw
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: echo "event=$EVENT ref=$REF ref_type=$REF_TYPE ref_name=$REF_NAME"
